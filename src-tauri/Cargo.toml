[package]
name = "tezkor"
version = "0.1.0"
description = "Tezkor — dasturchi, montajchi va har kun uchun vidjetlar"
authors = ["Shaxzod <https://sheyxzad.uz>"]
license = "MIT"
edition = "2021"

[lib]
name = "tezkor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
xcap = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
